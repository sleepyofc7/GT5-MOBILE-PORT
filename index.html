<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090711">
  <title>LINKS</title>

  <style>
    /* Fonte personalizada: coloque font.otf na mesma pasta deste arquivo. */
    @font-face {
      font-family: "SleepyFont";
      src: url("./font.otf") format("opentype");
      font-style: normal;
      font-weight: 100 800;
      font-display: swap;
    }

    :root {
      --accent: #6fcf5a;          /* verde "dinheiro" do GTA */
      --accent-dark: #3f8f2f;
      --panel: rgba(8, 8, 10, .78);
      --text: #fff;
      --muted: rgba(255,255,255,.8);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 105px 22px 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      font-family: "SleepyFont", Inter, ui-sans-serif, system-ui, sans-serif;
      font-weight: 400;
      background:
        linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.35) 50%, rgba(0,0,0,.7)),
        url("./fundo.png") center / cover fixed no-repeat,
        #0b0813;
      overflow-x: hidden;
    }

    /* Vinheta escura nas bordas, como tela de loading do jogo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65) 100%);
    }

    .home-button {
      position: fixed;
      z-index: 5;
      top: 24px;
      left: 24px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      color: white;
      text-decoration: none;
      border: 3px solid #fff;
      border-radius: 0;
      background: #000;
      box-shadow: 4px 4px 0 var(--accent);
      transform: skewX(-6deg);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    }

    .home-button svg { width: 22px; height: 22px; transform: skewX(6deg); }

    .home-button:hover {
      background: var(--accent);
      color: #000;
      transform: skewX(-6deg) translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 620px);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 18px;
      padding: 7px 16px 6px;
      color: #000;
      background: var(--accent);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .25em;
      text-transform: uppercase;
      transform: skewX(-8deg);
      box-shadow: 3px 3px 0 #000;
    }

    h1 {
      margin: 0 0 40px;
      font-size: clamp(36px, 8vw, 60px);
      line-height: 1.12;
      font-weight: 400;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-wrap: balance;
      color: #fff;
      /* contorno preto + sombra dura, estilo logo do GTA */
      -webkit-text-stroke: 3px #000;
      paint-order: stroke fill;
      text-shadow: 5px 5px 0 #000, 7px 7px 0 var(--accent-dark);
    }

    .links { display: grid; gap: 18px; }

    .link-card {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 22px 0 26px;
      color: white;
      text-align: left;
      text-decoration: none;
      border: 3px solid #fff;
      border-left: 12px solid var(--accent);
      border-radius: 0;
      background: var(--panel);
      box-shadow: 6px 6px 0 #000;
      transform: skewX(-6deg);
      transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
      animation: appear .5s both;
    }

    .link-card > * { transform: skewX(6deg); } /* desentorta o texto */

    .link-card:hover {
      background: var(--accent);
      color: #000;
      border-color: #000;
      border-left-color: #000;
      transform: skewX(-6deg) translate(-3px, -3px);
      box-shadow: 9px 9px 0 #000;
    }

    .link-name {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #000;
    }

    .link-card:hover .link-name { text-shadow: none; }

    .arrow {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: #000;
      background: #fff;
      font-size: 20px;
      font-family: system-ui, sans-serif;
    }

    .link-card:hover .arrow { background: #000; color: var(--accent); }

    footer {
      margin: 36px auto 0;
      max-width: 540px;
      padding: 14px 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: rgba(0,0,0,.7);
      border-top: 4px solid var(--accent);
    }

    footer strong { color: var(--accent); font-weight: 400; }

    .link-card:focus-visible,
    .home-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    @keyframes appear {
      from { opacity: 0; transform: skewX(-6deg) translateX(-24px); }
      to   { opacity: 1; transform: skewX(-6deg) translateX(0); }
    }

    @media (max-width: 520px) {
      body { padding: 105px 18px 40px; background-attachment: scroll; }
      .home-button { top: 17px; left: 17px; width: 49px; height: 49px; }
      h1 { margin-bottom: 30px; -webkit-text-stroke-width: 2px; text-shadow: 3px 3px 0 #000, 5px 5px 0 var(--accent-dark); }
      .link-card { min-height: 66px; padding: 0 16px 0 18px; }
      .link-name { font-size: 17px; }
      footer { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Troque o endereço abaixo pelo endereço do seu outro site. -->
  <a class="home-button" href="https://beacons.ai/sleepyofc7/principal" aria-label="Ir para meu outro site" title="Voltar">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.5 10.6 12 3.8l8.5 6.8v9.1a1.3 1.3 0 0 1-1.3 1.3h-5.1v-6.2h-4.2V21H4.8a1.3 1.3 0 0 1-1.3-1.3v-9.1Z"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <main>
    <p class="eyebrow">LINKS</p>
    <h1>Grand Theft Auto V Port Android</h1>
    <nav class="links" id="links" aria-label="Meus links"></nav>
    <footer><strong>AVISO:</strong> Tenha bastante espaço de armazenamento livre para evitar problemas de falta de memória durante a Extração</footer>
  </main>

  <script>
    // Edite esta lista para adicionar, remover ou alterar seus links.
    const links = [
      { name: "APK DO GTA V", url: "https://www.mediafire.com/file/6t05doiwd54ckxh/gt4five-By-Sleepy.apk/file" },
      { name: "DATA 31 GB (CONTÉM TODAS AS MISSÕES)", url: "https://buzzheavier.com/6vtq6p1o9aiy" },
    ];

    const container = document.getElementById("links");

    links.forEach((item, index) => {
      const a = document.createElement("a");
      a.className = "link-card";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.animationDelay = `${index * 90}ms`;

      const name = document.createElement("span");
      name.className = "link-name";
      name.textContent = item.name;

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "↗";

      a.append(name, arrow);
      container.appendChild(a);
    });
  </script>
</body>
</html>
