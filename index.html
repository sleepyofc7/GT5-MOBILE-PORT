<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090711">
  <title>LINKS</title>

  <style>
    /* Fonte personalizada: coloque font.otf na mesma pasta deste arquivo. */
    @font-face {
      font-family: "SleepyFont";
      src: url("./font.otf") format("opentype");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --accent: #a875ff;
      --glass: rgba(20, 17, 31, .48);
      --glass-border: rgba(255, 255, 255, .17);
      --text: #fff;
      --muted: rgba(255,255,255,.65);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 105px 22px 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      font-family: "SleepyFont", Inter, ui-sans-serif, system-ui, sans-serif;
      background:
        linear-gradient(135deg, rgba(7,5,13,.66), rgba(8,6,15,.48)),
        url("./fundo.png") center / cover fixed no-repeat,
        #0b0813;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 38%, rgba(157,103,255,.16), transparent 48%);
    }

    .home-button {
      position: fixed;
      z-index: 5;
      top: 24px;
      left: 24px;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow: 0 8px 30px rgba(0,0,0,.22), inset 0 1px 1px rgba(255,255,255,.18);
      transition: transform .25s ease, background .25s ease, border-color .25s ease;
    }

    .home-button:hover {
      transform: translateY(-3px) scale(1.05);
      background: rgba(168,117,255,.24);
      border-color: rgba(201,170,255,.65);
    }

    .home-button svg { width: 22px; height: 22px; }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 590px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 13px;
      color: rgba(255,255,255,.62);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 38px;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -.045em;
      text-wrap: balance;
      text-shadow: 0 5px 35px rgba(0,0,0,.35);
    }

    .links { display: grid; gap: 14px; }

    .link-card {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 22px;
      color: white;
      text-align: left;
      text-decoration: none;
      border: 1px solid var(--glass-border);
      border-radius: 19px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      backdrop-filter: blur(24px) saturate(155%);
      box-shadow: 0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.10);
      transition: transform .22s ease, background .22s ease, border-color .22s ease;
      animation: appear .55s both;
    }

    .link-card:hover {
      transform: translateY(-4px);
      background: rgba(105,75,150,.38);
      border-color: rgba(190,155,255,.48);
    }

    .link-name {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .01em;
    }

    .arrow {
      flex: 0 0 auto;
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.82);
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      font-size: 18px;
      transition: transform .22s ease, background .22s ease;
    }

    .link-card:hover .arrow {
      transform: translate(2px,-2px);
      background: rgba(255,255,255,.18);
    }

    footer {
      margin-top: 31px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(13px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 105px 18px 40px; background-attachment: scroll; }
      .home-button { top: 17px; left: 17px; width: 49px; height: 49px; }
      h1 { margin-bottom: 30px; }
      .link-card { min-height: 64px; border-radius: 16px; padding: 0 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Troque o endereço abaixo pelo endereço do seu outro site. -->
  <a class="home-button" href="https://beacons.ai/sleepyofc7/principal" aria-label="Ir para meu outro site" title="Voltar">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.5 10.6 12 3.8l8.5 6.8v9.1a1.3 1.3 0 0 1-1.3 1.3h-5.1v-6.2h-4.2V21H4.8a1.3 1.3 0 0 1-1.3-1.3v-9.1Z"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <main>
    <p class="eyebrow">LINKS</p>
    <h1>Grand Theft Auto V Port Android</h1>
    <nav class="links" id="links" aria-label="Meus links"></nav>
    <footer>AVISO: Tenha bastante espaço de armazenamento livre para evitar problemas de falta de memória durante a Extração</footer>
  </main>

  <script>
    // Edite esta lista para adicionar, remover ou alterar seus links.
    const links = [
      { name: "APK DO GTA V", url: "https://www.mediafire.com/file/6t05doiwd54ckxh/gt4five-By-Sleepy.apk/file" },
      { name: "DATA 31 GB (CONTÉM TODAS AS MISSÕES)", url: "https://buzzheavier.com/6vtq6p1o9aiy" },
    ];

    const container = document.getElementById("links");

    links.forEach((item, index) => {
      const a = document.createElement("a");
      a.className = "link-card";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.animationDelay = `${index * 90}ms`;

      const name = document.createElement("span");
      name.className = "link-name";
      name.textContent = item.name;

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "↗";

      a.append(name, arrow);
      container.appendChild(a);
    });
  </script>
</body>
</html>
